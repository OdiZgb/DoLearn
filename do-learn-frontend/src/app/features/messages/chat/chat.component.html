<div class="chat-container">
  <div class="chat-header">
    <div class="user-info">
      <div class="avatar">
        <mat-icon>account_circle</mat-icon>
      </div>
      <div class="user-details">
        <h3>User {{recipientId}}</h3>
        <div class="status">
          <span *ngIf="hubConnection?.state === HubConnectionState.Connected" class="online">
            <mat-icon>circle</mat-icon> Online
          </span>
          <span *ngIf="hubConnection?.state !== HubConnectionState.Connected" class="offline">
            <mat-icon>circle</mat-icon> Offline
          </span>
        </div>
      </div>
    </div>
    <button mat-icon-button class="back-button" (click)="router.navigate(['/messages'])">
      <mat-icon>arrow_back</mat-icon>
    </button>
  </div>

  <div class="messages-container" #messagesContainer>
    <div *ngFor="let message of messages" 
         class="message" 
         [class.sent]="message.senderId === currentUserId"
         [class.received]="message.senderId !== currentUserId">
      <div class="message-content">
        <div class="message-text">{{message.content}}</div>
        <div class="message-footer">
          <span class="time">{{message.createdDate | date:'shortTime'}}</span>
          <mat-icon *ngIf="message.senderId === currentUserId" 
                   class="read-status"
                   [class.read]="message.isRead">
            {{message.isRead ? 'done_all' : 'done'}}
          </mat-icon>
        </div>
      </div>
    </div>
  </div>

  <div class="input-container">
    <mat-form-field appearance="outline" class="message-input">
      <input matInput 
             [(ngModel)]="messageText" 
             placeholder="Type a message..."
             (keyup.enter)="sendMessage()"
             [disabled]="!recipientId || !currentUserId">
      <button mat-icon-button matSuffix (click)="sendMessage()" [disabled]="!messageText.trim()">
        <mat-icon>send</mat-icon>
      </button>
    </mat-form-field>
  </div>
</div>
